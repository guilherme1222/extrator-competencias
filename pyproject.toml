[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculos"
version = "0.1.0"
description = "Extração e banco de competências a partir de currículos e certificados"
requires-python = ">=3.11"
# Sem dependência obrigatória de propósito: ler um .docx e ver a prévia
# usa só a biblioteca padrão. Instale o extra conforme o que for usar.
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]          # ler currículo em PDF
db = ["psycopg[binary]>=3.1"]       # gravar no PostgreSQL
dev = ["pytest>=8", "pdfplumber>=0.11", "psycopg[binary]>=3.1"]

[project.scripts]
curriculos = "curriculos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
